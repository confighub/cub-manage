name: Update ConfigHub SDK

# Weekly bump of every github.com/confighub/sdk/* requirement to the latest SDK
# release, as one pull request. A bump that no longer builds or passes its tests
# is still opened, with a body that says so, so that the code change it needs is
# visible rather than silently skipped.
#
# The PR is always branch `chore/update-sdk`, force-pushed, so at most one is
# open at a time. Requires "Allow GitHub Actions to create and approve pull
# requests" in the repository's Actions settings. A PR opened with GITHUB_TOKEN
# does not start other workflows, so close and reopen it to run CI.

on:
  schedule:
    # Mondays, 14:00 UTC
    - cron: '0 14 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'SDK version to pin to (default: latest release)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Bump SDK modules
        env:
          SUMMARY_FILE: ${{ runner.temp }}/sdk-update.md
          VERSION: ${{ inputs.version }}
        run: |
          scripts/update-sdk.sh $VERSION || true
          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY_FILE: ${{ runner.temp }}/sdk-update.md
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Already on the latest SDK; nothing to open."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C chore/update-sdk
          git commit -am "deps: update ConfigHub SDK modules"
          git push -f origin chore/update-sdk

          # --state open matters: gh also resolves the branch to a merged PR,
          # which would send this week's update to last week's merged one.
          number="$(gh pr list --head chore/update-sdk --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            gh pr create \
              --base main \
              --head chore/update-sdk \
              --title 'deps: update ConfigHub SDK modules' \
              --body-file "$SUMMARY_FILE"
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" \
              -f body="$(cat "$SUMMARY_FILE")" >/dev/null
          fi
